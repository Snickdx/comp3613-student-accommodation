{% extends "base.html" %}
{% block title %}Sign in required · NestLink{% endblock %}

{% block content %}
<div class="auth-shell">
  <div class="pane-grid pane-grid--main" aria-hidden="true"></div>
  <div class="auth-panel">
    <div class="brand-wordmark">NestLink</div>
    <p class="auth-tagline">Your session expired or you need to sign in.</p>
    <div class="d-grid">
      <a class="btn btn-primary btn-lg" href="{{ url_for('login_view') }}">Return to sign in</a>
    </div>
  </div>
</div>
{% endblock %}
